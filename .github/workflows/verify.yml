name: Verify AVYO Personal

on:
  push:
    branches:
      - 'task*/**'
      - 'finalize/**'
  pull_request:
    branches:
      - feature/avyo-v2-base44-ai
      - 'task*/**'
      - 'finalize/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:run
      - run: pnpm build
