name: Verify AVYO Personal

on:
  push:
    branches:
      - task6/movement-flows
  pull_request:
    branches:
      - feature/avyo-v2-base44-ai

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:run
      - run: pnpm build
